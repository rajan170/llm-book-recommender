[project]
name = "llm-book-recommender"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "rajan170", email = "rajan.pr361@gmail.com" }
]
dependencies = [
    "kagglehub>=0.3.7",
    "pandas>=2.2.3",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "python-dotenv>=1.0.1",
    "langchain-community>=0.3.16",
    "langchain-chroma>=0.2.1",
    "transformers>=4.48.2",
    "gradio>=5.14.0",
    "jupyter>=1.1.1",
    "notebook>=7.3.2",
    "langchain-openai>=0.3.4",
    "sentence-transformers>=3.4.1",
    "langchain-huggingface>=0.1.2",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/llm_book_recommender"]
